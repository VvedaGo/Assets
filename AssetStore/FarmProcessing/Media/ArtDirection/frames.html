<style>

und:#f4f4f4;padding:25px;min-height:0}.panel h2{font-size:27px;margin:0 0 20px}.panel p{font-size:23px;line-height:1.5;color:#616970}.evidence{height:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.evidence .panel{display:flex;flex-direction:column}.evidence img{height:300px;width:100%;object-fit:contain;mix-blend-mode:multiply}.empty{border:2px dashed #a5b2b4;border-radius:10px;flex:1;min-height:180px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#58666b;padding:24px;background:repeating-linear-gradient(45deg,#edf0f0,#edf0f0 16px,#e8ecec 16px,#e8ecec 32px)}.empty b{font-size:26px}.empty small{font-size:20px;line-height:1.5;margin-top:14px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{padding:8px 12px;background:#dfe6e6;font-size:19px}.swatch{display:flex;align-items:center;margin:12px 0;gap:20px;font-size:23px}.swatch i{display:block;width:90px;height:66px;border-radius:6px}.panel ul{font-size:23px;line-height:1.75;padding-left:24px}.subcaps{position:absolute;left:2%;right:2%;bottom:130px;display:flex;justify-content:space-around;gap:20px;z-index:6}.subcaps span{background:#f2f2f2ed;padding:9px 16px;font-size:22px;font-weight:700;min-width:25%;text-align:center}.cmpnames{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;padding:0 25px 0;gap:0 12px}.cmpnames span{align-self:end;background:#eef0f0ec;padding:6px 10px;text-align:center;font-size:20px;font-weight:700;margin-bottom:9px}.card .scene,.cover .scene{inset:0;background:#173c45}.card .scene img,.cover .scene img{object-fit:fill}.brand{position:absolute;bottom:0;left:0;right:0;background:#20242a;color:#f2e6c9;z-index:7;font-weight:800}.brand .title{padding:4% 5% 2%;font-size:clamp(40px,6vw,118px);line-height:.98;letter-spacing:-.025em}.brand .accent{background:#c8473b;padding:1.3% 5%;font-size:clamp(16px,2.1vw,40px);letter-spacing:2px}.card .brand{height:38%}.cover .brand{height:24%}.cover .brand .title{font-size:6vw;padding:2.3% 4% 1.3%}.cover .brand .accent{font-size:2vw;padding:1% 4%}.card .tag{top:14px;right:16px;font-size:14px}.icon .scene,.social .scene{inset:0}.icon .scene img{object-fit:contain}.icon .tag,.social .tag{display:none}.steps{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:20px;height:100%}.stepnum{font-size:54px;color:#c8473b;font-weight:800}.steps .panel{display:flex;flex-direction:column}.steps h2{font-size:27px}.steps .empty{min-height:250px}.arrows{display:flex;justify-content:space-between;font-size:28px;color:#52656a;padding:0 30px;margin:15px 0}.note{position:absolute;right:34px;bottom:34px;font-size:17px;max-width:640px;text-align:right;color:#59636b}.mini{position:absolute;bottom:6px;right:12px;color:#d8e1e0;font-size:11px;z-index:9}
.content.catalog-large>.group{height:100%}.card .scene img{height:92%;object-fit:contain;align-self:flex-start}.card .brand .title{font-size:7.3vw}.cover .brand .title br{display:none}.cover .brand .title br:after{content:' '}

<div id="frame"></div><script src="catalog.js"></script><script>
const ids=['01_Icon','02_Card','03_Cover','04_Social','05_Hero','06_FullCollection','07_Closeups','08_VariantsAndModules','09_Technical','10_DemoAndVersion','11_CategoryDetails','12_Compositions','13_Materials','14_UnityAndComparison','15_StationsCatalog','16_ModulesCatalog'];
const caps=['','','','','WORKSHOP COURTYARD','FULL COLLECTION / 72 REFERENCE DESIGNS','CRAFTED MODEL DETAILS','MODULAR WORKSHOP KIT','GEOMETRY, LOD & COLLIDERS','WORKSHOP LAYOUT / ALTERNATE VIEW','TOOLS & PROCESSED PRODUCTS','8 WORKSHOP COMPOSITIONS / DESIGN STUDY','MATERIALS & TEXTURES','UNITY SETUP','12 PRODUCTION STATIONS','12 ARCHITECTURE MODULES'];
const media='/AssetStore/FarmProcessing/Media/ArtDirection/Raw/';const hero='/planning/FarmProcessing/previews/FarmProcessing_Hero_v1.png';
const img=(s)=>`<img src="${s}">`;const empty=(a,b)=>`<div class="empty"><b>${a}</b><small>${b}</small></div>`;
function group(prefix,title,n,cols,wide=false){const items=window.catalog.filter(x=>x.id.startsWith(prefix));return `<section class="group ${wide?'wide':''}"><h2>${title}<em>${n}</em></h2><div class="items" style="--cols:${cols}">${items.map(x=>`<div class="item">${img(x.src)}<span>${x.id}</span></div>`).join('')}</div></section>`}
function render(shot){let i=ids.indexOf(shot);if(i<0)i=4;shot=ids[i];let type='';let content='';let head='';let note='';
if(i===0){type='icon';content=`<div class="scene">${img(media+'01_Icon.png')}</div>`}
else if(i===1||i===2){type=i===1?'card':'cover';content=`<div class="scene">${img(media+shot+'.png')}</div><div class="brand"><div class="title">${i===2?'FARM PROCESSING':'FARM<br>PROCESSING'}</div><div class="accent">LOW POLY WORKSHOPS</div></div>`}
else if([3,4,6,7,9,11].includes(i)){type=i===3?'social':'';const src=[3,4].includes(i)?hero:media+shot+'.png';content=`<div class="scene">${img(src)}${i===11?'<div class="cmpnames">'+['DAIRY','JUICE PRESSING','GRAIN MILLING','JAM & DRYING','BAKERY','SEED OIL','SMOKEHOUSE','HONEY'].map(x=>`<span>${x}</span>`).join('')+'</div>':''}</div>`;if(i===6)content+='<div class="subcaps"><span>SCREW & PRESS PLATE</span><span>CHEESE & TOOLS</span><span>HONEY & HONEYCOMB</span></div>';if(i===7)content+='<div class="subcaps"><span>SEPARATE MODULES</span><span>ASSEMBLED WORKSHOP BAY</span></div>'}
else if(i===5){head='THE COMPLETE DESIGN CATALOG';content='<div class="content"><div class="groups">'+group('STA','PRODUCTION STATIONS',12,6)+group('FUR','WORKSHOP FURNITURE',12,6)+group('MOD','ARCHITECTURE MODULES',12,6)+group('TOL','PROCESSING TOOLS',18,9,true)+group('PRD','FOOD & INTERMEDIATES',18,9,true)+'</div></div>';note='Reference designs, grouped by catalog ID. Final inventory follows the approved 3D build.'}
else if(i===10){head='THE SMALL DETAILS THAT COMPLETE A WORKSHOP';content='<div class="content catalog-large"><div class="two">'+group('TOL','PROCESSING TOOLS',18,6)+group('PRD','FOOD & INTERMEDIATES',18,6)+'</div></div>';note='18 tools + 18 product designs. Grouped images use category-specific display scales.'}
else if(i===14||i===15){head=i===14?'ONE DISTINCT SILHOUETTE FOR EACH PROCESS':'BUILD A CONSISTENT WORKSHOP';content='<div class="content catalog-large">'+group(i===14?'STA':'MOD',i===14?'STATIONS':'MODULAR COMPONENTS',12,4)+'</div>';note='Reference designs. Dimensions and functional parts are defined in MODEL_CATALOG.md.'}
else if(i===8){head='TECHNICAL SHOT / CAPTURE PLAN';content=`<div class="content evidence"><div class="panel"><h2>01 / SHADED MODEL</h2>${img('/planning/FarmProcessing/references/STA-05.png')}<p>Use the final exported press, cheese vat and bread oven.</p><div class="chips"><span>STA-05</span><span>STA-01</span><span>STA-09</span></div></div><div class="panel"><h2>02 / SHADED WIREFRAME</h2>${empty('REAL UNITY CAPTURE','Same angle as shaded model.<br>LOD0 and LOD1 counts from the final FBX.')}<p>Measured tris / model<br>LOD coverage / exceptions</p></div><div class="panel"><h2>03 / COLLIDERS</h2>${empty('REAL UNITY CAPTURE','Show collider gizmos on the actual prefab.<br>Keep geometry and collisions legible.')}<p>Collider types / coverage<br>Verified scale / pivots</p></div></div>`;note='Layout template only. No measured geometry, LOD or collision claims yet.'}
else if(i===12){head='MATERIALS / PRESENTATION & EVIDENCE';const colors=[['Warm wood','#B5835A'],['Dark wood','#7A5233'],['Cream','#F2E6C9'],['Coral accent','#C8473B'],['Matte metal','#8E959B'],['Stone','#A7A39A']];content=`<div class="content two"><div class="panel"><h2>ART DIRECTION PALETTE</h2>${colors.map(([n,c])=>`<div class="swatch"><i style="background:${c}"></i><b>${n}</b><span>${c}</span></div>`).join('')}<p>Design colors, not a claim about shipped textures.</p></div><div class="panel" style="display:flex;flex-direction:column"><h2>ACTUAL MATERIAL & ATLAS EVIDENCE</h2>${empty('CAPTURE FROM THE FINAL PACKAGE','Show real Base Color textures / palette atlases<br>and 2–3 final models using them.')}<ul><li>Measured material and texture counts</li><li>Actual sizes, formats and map types</li><li>Verified shader / render pipeline</li></ul></div></div>`;note='Layout template. Replace swatches with the actual shipped texture samples where appropriate.'}
else if(i===13){head='UNITY SETUP / EDITOR CAPTURE PLAN';content=`<div class="content steps"><div class="panel"><span class="stepnum">01</span><h2>PACKAGE STRUCTURE</h2>${empty('PROJECT PANEL','Assets / FarmProcessing<br>Models · Materials · Prefabs<br>Scenes · Documentation')}<p>Open final package folders. Keep names readable.</p></div><div class="panel"><span class="stepnum">02</span><h2>DEMO SCENE + SELECTED PREFAB</h2>${empty('REAL UNITY EDITOR SCREENSHOT','Show Demo_WorkshopCourtyard and one selected station.<br>Use an actual capture, never a reconstructed Editor UI.')}<p>Crop the Editor to useful panels. Scene stays the largest area.</p></div><div class="panel"><span class="stepnum">03</span><h2>INSPECTOR</h2>${empty('ACTUAL PREFAB DATA','Transform / scale<br>Mesh Renderer / material<br>Collider / LODGroup if included')}<p>Readable component values. No Lite/Full comparison for this product.</p></div></div>`;note='Layout template. Final compatibility and prefab counts require the actual package.'}
document.getElementById('frame').className=type;document.getElementById('frame').innerHTML=content+(head?`<div class="header"><h1>${head}</h1><p>Farm Processing · ${[8,12,13].includes(i)?'evidence layout':'reference collection'}</p></div>`:'')+(![0,1,2,3].includes(i)?`<div class="plate"><small>FARM PROCESSING</small><strong>${caps[i]}</strong></div>`:'')+(![0,3].includes(i)?`<div class="tag">${[8,12,13].includes(i)?'LAYOUT TEMPLATE':'CONCEPT PREVIEW'}</div>`:'')+(note?`<div class="note">${note}</div>`:'');document.title=shot;window.currentShot=shot;return shot;}
window.setShot=render;render(new URLSearchParams(location.search).get('shot')||'05_Hero');
</script></html>
